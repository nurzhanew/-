<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #remotion-intro {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #title {
        color: #f4f4f5;
        font-size: 72px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <!-- Rendered by Remotion: cd ../remotion && npm run render:hf -->
      <video
        id="remotion-intro"
        src="assets/remotion-intro.mp4"
        data-start="0"
        data-duration="5"
        data-track-index="0"
        playsinline
        muted
      ></video>
      <h1 id="title" class="clip" data-start="5" data-duration="3" data-track-index="1">
        Remotion + HyperFrames
      </h1>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6 }, 5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
