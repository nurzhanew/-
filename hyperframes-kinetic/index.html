<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/fonts/montserrat-600-cyrillic.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/fonts/montserrat-600-latin.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/fonts/montserrat-800-cyrillic.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/fonts/montserrat-800-latin.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 900; src: url("assets/fonts/montserrat-900-cyrillic.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Montserrat"; font-weight: 900; src: url("assets/fonts/montserrat-900-latin.woff2") format("woff2"); }

      :root { --ink: #0b0b0f; --white: #fff; --accent: #ffd400; --danger: #ff3b30; --success: #34c759; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Montserrat", sans-serif; }

      .footage { position: absolute; inset: 0; overflow: hidden; }
      .footage .inner { position: absolute; inset: 0; transform-origin: 50% 38%; }
      .footage video { width: 100%; height: 100%; object-fit: cover; }
      .overlay-video { position: absolute; inset: 0; width: 100%; height: 100%; }
      .layer { position: absolute; inset: 0; }

      /* Kinetic words sit in the top band, above faces and the burned-in captions. */
      .band { position: absolute; left: 0; right: 0; top: 180px; display: flex; flex-direction: column; align-items: center; }
      .mega { white-space: nowrap; font-weight: 900; line-height: 0.92; letter-spacing: -3px; text-align: center; }
      .yellow { color: var(--accent); }
      .outline { color: rgba(255, 255, 255, 0.14); -webkit-text-stroke: 5px var(--white); }
      .shadow { filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.6)); }
      .chip { font-weight: 900; font-size: 46px; padding: 10px 26px; border-radius: 14px; background: var(--ink); color: var(--accent); }
      .chip.red { background: var(--danger); color: var(--white); }
      .letter { display: inline-block; }

      .wipe { position: absolute; top: -300px; bottom: -300px; width: 1500px; left: -1700px; background: var(--accent); transform: skewX(-14deg); }
      .wipe::after { content: ""; position: absolute; top: 0; bottom: 0; right: -70px; width: 50px; background: var(--ink); }

      .bill { position: absolute; width: 150px; height: 74px; border-radius: 10px; background: linear-gradient(135deg, #3ddc84, #1e9e5a); border: 4px solid #c9f7dc; display: flex; align-items: center; justify-content: center; }
      .bill::before { content: ""; width: 40px; height: 40px; border-radius: 50%; border: 5px solid #c9f7dc; }

      .lens-dim { position: absolute; inset: 0; }
      .lens { position: absolute; width: 460px; height: 460px; border-radius: 50%; border: 10px solid var(--accent); box-shadow: 0 0 0 6px var(--ink), 0 0 60px rgba(255, 212, 0, 0.6); }
      .lens::before, .lens::after { content: ""; position: absolute; background: var(--accent); }
      .lens::before { left: 50%; top: 30%; bottom: 30%; width: 6px; margin-left: -3px; }
      .lens::after { top: 50%; left: 30%; right: 30%; height: 6px; margin-top: -3px; }

      .slide { position: absolute; inset: 0; background: var(--accent); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; }
      .slide .mega { color: var(--ink); }
      .strike { position: relative; display: inline-block; }
      .strike i { position: absolute; left: -10px; right: -10px; top: 50%; height: 16px; margin-top: -8px; border-radius: 8px; background: var(--danger); transform-origin: left center; transform: scaleX(0); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="kinetic" data-start="0" data-duration="24.94" data-width="1080" data-height="1920">

      <div class="footage" id="shot-a">
        <div class="inner">
          <video id="part2" src="assets/footage/part2.mp4" data-start="0" data-duration="10.38" data-track-index="1" playsinline data-has-audio="true" data-volume="1.4"></video>
        </div>
      </div>
      <div class="footage" id="shot-b">
        <div class="inner">
          <video id="part3" src="assets/footage/part3.mp4" data-start="10.38" data-duration="14.56" data-track-index="2" playsinline data-has-audio="true" data-volume="1.4"></video>
        </div>
      </div>

      <!-- Money into the bin -->
      <div class="clip layer" id="money" data-start="2.5" data-duration="1.65" data-track-index="4">
        <div class="band">
          <div class="mega yellow shadow" style="font-size:190px;" id="money-word">ДЕНЬГИ</div>
          <div class="chip red" style="margin-top:18px;" id="money-chip">В МУСОР</div>
        </div>
        <div class="bill" style="left:140px;top:120px;"></div>
        <div class="bill" style="left:790px;top:60px;"></div>
        <div class="bill" style="left:470px;top:20px;"></div>
      </div>

      <!-- Laptop is slow: letters crawl in -->
      <div class="clip layer" id="slow" data-start="8.05" data-duration="1.4" data-track-index="4">
        <div class="band">
          <div class="chip">НОУТБУК</div>
          <div class="mega shadow" style="font-size:128px;color:#fff;margin-top:14px;" id="slow-word"><span class="letter">Т</span><span class="letter">О</span><span class="letter">Р</span><span class="letter">М</span><span class="letter">О</span><span class="letter">З</span><span class="letter">И</span><span class="letter">Т</span></div>
        </div>
      </div>

      <!-- Printer stops -->
      <div class="clip layer" id="printer" data-start="9.45" data-duration="1.75" data-track-index="4">
        <div class="band">
          <div class="chip">ПРИНТЕР</div>
          <div class="mega shadow" style="font-size:118px;color:var(--danger);margin-top:14px;" id="printer-word">НЕ ПЕЧАТАЕТ</div>
        </div>
      </div>

      <!-- Replace? -->
      <div class="clip layer" id="replace" data-start="11.25" data-duration="1.4" data-track-index="4">
        <div class="band">
          <div class="strike"><div class="mega outline shadow" style="font-size:150px;">ЗАМЕНА?</div><i></i></div>
        </div>
      </div>

      <!-- Fixes -->
      <div class="clip layer" id="fixes" data-start="13.95" data-duration="2.2" data-track-index="4">
        <div class="band" style="align-items:flex-start;padding-left:70px;">
          <div class="mega yellow shadow" style="font-size:140px;" id="fix-1">РЕМОНТ ✓</div>
          <div class="mega shadow" style="font-size:96px;color:#fff;margin-top:8px;" id="fix-2">ЗАПРАВКА ✓</div>
        </div>
      </div>

      <!-- Find the cause: lens over the motherboard -->
      <div class="clip layer" id="cause" data-start="16.26" data-duration="2.08" data-track-index="4">
        <div class="lens-dim" id="lens-dim"></div>
        <div class="lens" id="lens" style="left:140px;top:820px;"></div>
        <div class="band">
          <div class="chip">СНАЧАЛА</div>
          <div class="mega yellow shadow" style="font-size:150px;margin-top:14px;">ПРИЧИНА</div>
        </div>
      </div>

      <!-- Full-screen kinetic slide -->
      <div class="clip layer" id="save" data-start="18.4" data-duration="2.2" data-track-index="5">
        <div class="slide" id="save-slide">
          <div class="mega" style="font-size:160px;line-height:1.05;" id="save-1">НЕ ТРАТЬ</div>
          <div class="mega" style="font-size:112px;line-height:1.1;" id="save-2">ДЕНЬГИ НА</div>
          <div class="strike" id="save-3"><div class="mega" style="font-size:96px;line-height:1.2;">НОВУЮ ТЕХНИКУ</div><i></i></div>
          <div class="chip" style="margin-top:30px;font-size:56px;" id="save-4">СНАЧАЛА — ДИАГНОСТИКА</div>
        </div>
      </div>

      <!-- Remotion scenes -->
      <video id="intro" class="overlay-video" src="assets/overlays/kinetic-intro.webm" data-start="0" data-duration="2.2" data-track-index="6" playsinline muted></video>
      <video id="wheel" class="overlay-video" src="assets/overlays/kinetic-wheel.webm" data-start="4.2" data-duration="2.93" data-track-index="6" playsinline muted></video>
      <video id="cta" class="overlay-video" src="assets/overlays/cta.webm" data-start="20.54" data-duration="4.4" data-track-index="6" playsinline muted></video>

      <!-- Diagonal wipes on the cuts -->
      <div class="clip layer" id="wipes" data-start="0" data-duration="24.94" data-track-index="7" style="pointer-events:none;">
        <div class="wipe" id="wipe"></div>
      </div>

      <!-- Sound. Music credit: "Uplifting Corporate" by Soundrider/Dope (Jamendo), CC BY. -->
      <audio id="music" src="assets/music/uplifting-corporate.mp3" data-start="0" data-duration="24.94" data-media-start="27.6" data-track-index="10" data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.2},{"t":0.5,"v":0.075},{"t":18.4,"v":0.075},{"t":18.6,"v":0.12},{"t":20.4,"v":0.12},{"t":20.6,"v":0.075},{"t":23.4,"v":0.075},{"t":24.94,"v":0}]}]}'></audio>
      <audio id="sfx-impact" src="assets/sfx/impact-short.wav" data-start="0" data-duration="0.9" data-track-index="11" data-volume="0.24"></audio>
      <audio id="sfx-impact-2" src="assets/sfx/impact-short.wav" data-start="0.07" data-duration="0.9" data-track-index="12" data-volume="0.18"></audio>
      <audio id="sfx-whoosh-intro" src="assets/sfx/whoosh.mp3" data-start="1.6" data-duration="0.57" data-track-index="13" data-volume="0.5"></audio>
      <audio id="sfx-coin-1" src="assets/sfx/coin.wav" data-start="2.62" data-duration="0.9" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-coin-2" src="assets/sfx/coin.wav" data-start="3.2" data-duration="0.9" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-whoosh-wheel" src="assets/sfx/whoosh.mp3" data-start="4.06" data-duration="0.57" data-track-index="13" data-volume="0.5"></audio>
      <audio id="sfx-error-wheel" src="assets/sfx/error.mp3" data-start="4.43" data-duration="1.4" data-track-index="11" data-volume="0.25"></audio>
      <audio id="sfx-pop-wheel" src="assets/sfx/pop.mp3" data-start="6.14" data-duration="0.7" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-whoosh-1" src="assets/sfx/whoosh.mp3" data-start="7.26" data-duration="0.57" data-track-index="13" data-volume="0.55"></audio>
      <audio id="sfx-typing" src="assets/sfx/typing.mp3" data-start="7.65" data-duration="1.3" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-error" src="assets/sfx/error.mp3" data-start="8.86" data-duration="1.6" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-pop-replace" src="assets/sfx/pop.mp3" data-start="11.13" data-duration="0.7" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-impact-replace" src="assets/sfx/impact-short.wav" data-start="11.85" data-duration="0.9" data-track-index="12" data-volume="0.14"></audio>
      <audio id="sfx-whoosh-2" src="assets/sfx/whoosh.mp3" data-start="12.56" data-duration="0.57" data-track-index="13" data-volume="0.55"></audio>
      <audio id="sfx-chime-1" src="assets/sfx/chime.mp3" data-start="13.6" data-duration="1.4" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-chime-2" src="assets/sfx/chime.mp3" data-start="14.38" data-duration="1.4" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-whoosh-3" src="assets/sfx/whoosh.mp3" data-start="16.1" data-duration="0.57" data-track-index="13" data-volume="0.55"></audio>
      <audio id="sfx-whoosh-4" src="assets/sfx/whoosh.mp3" data-start="18.24" data-duration="0.57" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx-pop-s1" src="assets/sfx/pop.mp3" data-start="18.48" data-duration="0.7" data-track-index="12" data-volume="0.45"></audio>
      <audio id="sfx-pop-s2" src="assets/sfx/pop.mp3" data-start="18.78" data-duration="0.7" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-impact-save" src="assets/sfx/impact-short.wav" data-start="19.48" data-duration="0.9" data-track-index="12" data-volume="0.16"></audio>
      <audio id="sfx-whoosh-5" src="assets/sfx/whoosh.mp3" data-start="20.42" data-duration="0.57" data-track-index="13" data-volume="0.55"></audio>
      <audio id="sfx-typing-cta" src="assets/sfx/typing.mp3" data-start="20.55" data-duration="1.3" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-send" src="assets/sfx/pop.mp3" data-start="21.88" data-duration="0.7" data-track-index="12" data-volume="0.55"></audio>
      <audio id="sfx-heart" src="assets/sfx/chime.mp3" data-start="21.6" data-duration="2.0" data-track-index="13" data-volume="0.35"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const slam = { duration: 0.35, ease: "back.out(2.4)" };

      // Punch-ins on emphasis words and a slow push on the closing shot.
      tl.fromTo("#shot-a .inner", { scale: 1.06 }, { scale: 1, duration: 0.5, ease: "power2.out" }, 2.0);
      tl.to("#shot-a .inner", { scale: 1.14, duration: 0.15, ease: "power3.out" }, 2.76);
      tl.to("#shot-a .inner", { scale: 1, duration: 0.3, ease: "power2.inOut" }, 4.0);
      tl.fromTo("#shot-b .inner", { scale: 1 }, { scale: 1.12, duration: 0.15, ease: "power3.out" }, 11.85);
      tl.to("#shot-b .inner", { scale: 1, duration: 0.2 }, 12.6);
      tl.fromTo("#shot-b .inner", { scale: 1 }, { scale: 1.15, duration: 2.0, ease: "power1.inOut" }, 16.26);
      tl.to("#shot-b .inner", { scale: 1, duration: 0.01 }, 18.33);
      tl.fromTo("#shot-b .inner", { scale: 1 }, { scale: 1.08, duration: 4.36, ease: "none" }, 20.58);

      // Diagonal wipes centred on each cut.
      [7.42, 12.72, 16.26, 20.58].forEach((t) => {
        tl.fromTo("#wipe", { x: 0 }, { x: 3400, duration: 0.42, ease: "power2.inOut", immediateRender: false }, t - 0.21);
      });

      // Money
      tl.from("#money-word", { scale: 2.6, opacity: 0, ...slam }, 2.5);
      tl.from("#money-chip", { y: 40, opacity: 0, rotation: -8, ...slam }, 2.8);
      tl.to("#money-word", { y: 30, duration: 1.2, ease: "none" }, 2.85);
      tl.fromTo("#money .bill", { y: -200, rotation: -40 }, { y: 1900, rotation: 70, duration: 1.4, ease: "power2.in", stagger: 0.1 }, 2.6);
      tl.to("#money .band", { x: -1100, duration: 0.22, ease: "power3.in" }, 3.93);

      // Slow: letters crawl in one by one.
      tl.from("#slow .chip", { y: -40, opacity: 0, duration: 0.25 }, 8.05);
      tl.from("#slow-word .letter", { y: 80, opacity: 0, duration: 0.35, ease: "power1.out", stagger: 0.09 }, 8.1);
      tl.to("#slow .band", { opacity: 0, duration: 0.12 }, 9.33);

      // Printer: jitter in red.
      tl.from("#printer .chip", { y: -40, opacity: 0, duration: 0.25 }, 9.45);
      tl.from("#printer-word", { scale: 1.8, opacity: 0, ...slam }, 9.52);
      tl.to("#printer-word", { keyframes: { x: [0, -22, 18, -14, 10, -6, 0] }, duration: 0.45 }, 9.9);
      tl.to("#printer .band", { y: -60, opacity: 0, duration: 0.2 }, 11.0);

      // Replace? crossed out.
      tl.from("#replace .mega", { scale: 0.4, opacity: 0, ...slam }, 11.25);
      tl.to("#replace .strike i", { scaleX: 1, duration: 0.2, ease: "power3.out" }, 11.85);
      tl.to("#replace .band", { scale: 1.3, opacity: 0, duration: 0.2 }, 12.45);

      // Fixes: big words slide in from the left.
      tl.from("#fix-1", { x: -1100, duration: 0.4, ease: "power4.out" }, 13.97);
      tl.from("#fix-2", { x: -1100, duration: 0.4, ease: "power4.out" }, 14.76);
      tl.to("#fixes .band", { x: 1200, duration: 0.25, ease: "power3.in" }, 15.9);

      // Lens sweeping the board with the outside dimmed.
      tl.fromTo("#lens", { x: 0, y: 0, scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 16.3);
      tl.to("#lens", { x: 340, y: 200, duration: 0.9, ease: "sine.inOut" }, 16.65);
      tl.to("#lens", { x: 160, y: 80, duration: 0.6, ease: "sine.inOut" }, 17.55);
      tl.fromTo("#lens-dim", { background: "radial-gradient(circle 240px at 370px 1050px, transparent 98%, rgba(0,0,0,0.55) 100%)" }, { background: "radial-gradient(circle 240px at 710px 1250px, transparent 98%, rgba(0,0,0,0.55) 100%)", duration: 0.9, ease: "sine.inOut" }, 16.65);
      tl.to("#lens-dim", { background: "radial-gradient(circle 240px at 530px 1130px, transparent 98%, rgba(0,0,0,0.55) 100%)", duration: 0.6, ease: "sine.inOut" }, 17.55);
      tl.from("#cause .chip", { y: -40, opacity: 0, duration: 0.25 }, 16.4);
      tl.from("#cause .mega", { scale: 2, opacity: 0, ...slam }, 16.5);

      // Full-screen kinetic slide.
      tl.from("#save-slide", { clipPath: "inset(100% 0 0 0)", duration: 0.3, ease: "power3.out" }, 18.4);
      tl.from("#save-1", { y: 160, opacity: 0, ...slam }, 18.5);
      tl.from("#save-2", { y: 160, opacity: 0, ...slam }, 18.8);
      tl.from("#save-3", { y: 160, opacity: 0, ...slam }, 19.1);
      tl.to("#save-3 i", { scaleX: 1, duration: 0.25, ease: "power3.out" }, 19.5);
      tl.from("#save-4", { scale: 0, ...slam }, 19.8);

      window.__timelines["kinetic"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
